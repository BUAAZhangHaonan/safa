g_checkpoint: artifacts/checkpoints/e13_pu_adamw_meanflow_sit_stage2_gpu5_200ep/best.pt
checkpoint_model: raw
latent_training: true
pixel_image_size: 256
vae_model: stabilityai/sd-vae-ft-ema
vae_path: artifacts/checkpoints/external/sd-vae-ft-ema
vae_scaling_factor: 0.18215
out_json: artifacts/eval/e13_pu_adamw_meanflow_sit_gpu23_20260618/best/result.json
per_sample_jsonl: artifacts/eval/e13_pu_adamw_meanflow_sit_gpu23_20260618/best/per_sample.jsonl

experiment_name: e17_sit_diffusion_l2_face_mixed_2400ep
seed: 1337
sampling_seed: 1337
device: cuda:0
num_workers: 16
global_batch_size: 16
per_device_batch_size: 16
amp: true
learning_rate: 0.0001
weight_decay: 0.0
latent_training: true
pixel_image_size: 256
vae_model: stabilityai/sd-vae-ft-ema
vae_path: artifacts/checkpoints/external/sd-vae-ft-ema
vae_scaling_factor: 0.18215
image_size: 32
embedding_dim: 512
train_index: data/index/train_face_mixed_e14.jsonl
train_features: artifacts/e0_features/train_face_mixed_e14_e0_medium_v1
e0_checkpoint: artifacts/checkpoints/e0_medium_v1/best.pt
out_dir: artifacts/checkpoints/e17_sit_diffusion_l2_face_mixed_2400ep
allow_stage2_without_stage1_gate: true
resume_from: ''
resume_mode: model_weights_only
resume_optimizer_state: false
resume_from_legacy_stage1_metrics: false
ema:
  enabled: true
  decay: 0.9999
  evaluate_raw: true
  evaluate_ema: true
  save_ema_checkpoint: true
best_model: ema
distributed:
  backend: gloo
generator:
  model_type: sit_diffusion
  base_channels: 1
  channel_multipliers:
  - 1
  time_embedding_dim: 128
  condition_dim: 512
  sample_steps: 16
  train_cycle_steps: 16
  cycle_steps_schedule: []
  sampler: ddim
  learned_null_condition: true
  sit_input_channels: 4
  sit_data_space: latent
  sit_patch_size: 2
  sit_hidden_size: 1024
  sit_depth: 24
  sit_num_heads: 16
  sit_mlp_ratio: 4.0
  sit_time_embedding_dim: 256
  attention_backend: auto
  sit_pretrained_path: artifacts/checkpoints/external/meanflow_sit/zhuyu_sit_l_2_imagenet256.pt
  sit_pretrained_state_key: ''
  sit_pretrained_source: zhuyu-cs/MeanFlow ImageNet256 sit_l_2_meanflow_ema.pt; partial warm start only
  sit_pretrained_source_repo: https://github.com/zhuyu-cs/MeanFlow; https://drive.google.com/drive/folders/1oWt6tdm5WIeVaZnBuUVheKIG3cNDffl9?usp=drive_link
  diffusion_train_timesteps: 1000
  diffusion_beta_schedule: linear
  diffusion_prediction_type: epsilon
  ddim_beta_start: 0.0001
  ddim_beta_end: 0.02
  ddim_eta: 0.0
grad_clip_norm: 1.0
stages:
  stage1:
    epochs: 0
    require_face_detection_gate: false
  stage2:
    epochs: 2400
    gradient_monitor:
      enabled: false
      interval: 20
      max_samples: 8
    stage2_objective:
      type: fm_only_probe
      flow_condition: learned_null_condition
    quality_eval:
      enabled: true
      metrics:
      - niqe
      - fid
      - kid
      niqe_interval_epochs: 5
      niqe_max_samples: 256
      distribution_interval_epochs: 50
      distribution_max_samples: 2048
      distribution_timeout_seconds: 3600
      quality_num_workers: 4
      real_index: data/index/val_face_mixed_e14.jsonl
      distribution_cuda_visible_devices: '0'
      distribution_device: cuda:0
      output_dir: artifacts/eval/e17_sit_diffusion_l2_face_mixed_2400ep/quality
      model: ema
validation:
  enabled: true
  index: data/index/val_face_mixed_e14.jsonl
  features: artifacts/e0_features/val_face_mixed_e14_e0_medium_v1
  max_samples: 128
  batch_size: 16
  face_detection:
    enabled: true
    model_name: buffalo_l

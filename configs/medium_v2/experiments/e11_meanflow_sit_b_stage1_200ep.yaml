experiment_name: e11_meanflow_sit_b_stage1_200ep
seed: 1337
sampling_seed: 1337
device: cuda:0
num_workers: 8
global_batch_size: 16
per_device_batch_size: 16
amp: false
learning_rate: 0.0001
weight_decay: 0.0
latent_training: true
pixel_image_size: 256
vae_model: stabilityai/sd-vae-ft-ema
vae_path: artifacts/checkpoints/external/sd-vae-ft-ema
vae_scaling_factor: 0.18215
image_size: 32
embedding_dim: 512
train_index: data/index/train_balanced_medium.jsonl
train_features: artifacts/e0_features/train_balanced_medium_e0_medium_v1
e0_checkpoint: artifacts/checkpoints/e0_medium_v1/best.pt
out_dir: artifacts/checkpoints/e11_meanflow_sit_b_stage1_200ep
allow_stage2_without_stage1_gate: true
resume_from_legacy_stage1_metrics: false
ema:
  enabled: true
  decay: 0.9999
  evaluate_raw: true
  evaluate_ema: true
  save_ema_checkpoint: true
best_model: ema
distributed:
  backend: gloo
generator:
  model_type: meanflow_sit
  base_channels: 1
  channel_multipliers: [1]
  time_embedding_dim: 128
  condition_dim: 512
  sample_steps: 1
  train_cycle_steps: 1
  cycle_steps_schedule: []
  sampler: meanflow
  learned_null_condition: true
  meanflow_ratio: 0.25
  meanflow_ratio_r_not_equal_t: 0.75
  meanflow_adaptive_weighting: true
  meanflow_norm_p: 1.0
  meanflow_norm_eps: 0.001
  meanflow_jvp_mode: torch_func
  sit_input_channels: 4
  sit_data_space: latent
  sit_patch_size: 4
  sit_hidden_size: 768
  sit_depth: 12
  sit_num_heads: 12
  sit_mlp_ratio: 4.0
  sit_time_embedding_dim: 256
  sit_pretrained_path: artifacts/checkpoints/external/meanflow_sit/zhuyu_sit_b_4_imagenet256.pt
  sit_pretrained_state_key: ""
  sit_pretrained_source: https://drive.google.com/drive/folders/1oWt6tdm5WIeVaZnBuUVheKIG3cNDffl9?usp=drive_link
  sit_pretrained_source_repo: zhuyu-cs/MeanFlow@40a766689c8bccad61f2993ee6905630ac030ff3
grad_clip_norm: 1.0
stages:
  stage1:
    epochs: 0
    require_face_detection_gate: false
  stage2:
    epochs: 200
    gradient_monitor:
      enabled: true
      interval: 20
      max_samples: 8
    stage2_objective:
      type: fm_only_probe
      flow_condition: learned_null_condition
    quality_eval:
      enabled: true
      metrics: [niqe, fid, kid]
      niqe_interval_epochs: 1
      niqe_max_samples: 512
      distribution_interval_epochs: 20
      distribution_max_samples: 3969
      distribution_timeout_seconds: 3600
      quality_num_workers: 2
      real_index: data/index/val_single_face.jsonl
      distribution_cuda_visible_devices: "0"
      distribution_device: cuda:0
      output_dir: artifacts/eval/e11_meanflow_sit_b_stage1_200ep/quality
      model: ema
validation:
  enabled: true
  index: data/index/val_single_face.jsonl
  features: artifacts/e0_features/val_single_face_e0_medium_v1
  max_samples: 512
  batch_size: 16
  face_detection:
    enabled: true
    model_name: buffalo_l

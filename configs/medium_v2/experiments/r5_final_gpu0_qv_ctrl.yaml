
experiment_name: r5_final_gpu0_qv_ctrl
seed: 1337
sampling_seed: 1337
device: cuda:0
num_workers: 8
global_batch_size: 8
per_device_batch_size: 8
amp: false
learning_rate: 5.0e-05
weight_decay: 0.0
optimizer_type: adamw
latent_training: true
pixel_image_size: 256
vae_model: stabilityai/sd-vae-ft-ema
vae_path: artifacts/checkpoints/external/sd-vae-ft-ema
vae_scaling_factor: 0.18215
image_size: 32
embedding_dim: 512
train_index: data/index/train_balanced_medium.jsonl
train_features: artifacts/e0_features/train_balanced_medium_e0_medium_v1
e0_checkpoint: artifacts/checkpoints/e0_medium_v1/best.pt
out_dir: artifacts/checkpoints/r5_final_gpu0_qv_ctrl
allow_stage2_without_stage1_gate: true
resume_from: artifacts/checkpoints/e15_meanflow_sit_b_face_mixed_h100_resume_2400ep/last.pt
resume_mode: model_weights_only
resume_optimizer_state: false
resume_from_legacy_stage1_metrics: false
generator_trainable: ip_adapter
ddp_find_unused_parameters: true
ema:
  enabled: false
  decay: 0.9999
  evaluate_raw: true
  evaluate_ema: false
  save_ema_checkpoint: false
best_model: raw
distributed:
  backend: gloo
generator:
  model_type: meanflow_sit
  base_channels: 1
  channel_multipliers:
  - 1
  time_embedding_dim: 128
  condition_dim: 512
  sample_steps: 1
  train_cycle_steps: 1
  cycle_steps_schedule: []
  sampler: meanflow
  learned_null_condition: true
  meanflow_ratio: 0.25
  meanflow_ratio_r_not_equal_t: 0.75
  meanflow_adaptive_weighting: true
  meanflow_norm_p: 1.0
  meanflow_norm_eps: 0.001
  meanflow_jvp_mode: torch_func
  sit_input_channels: 4
  sit_data_space: latent
  sit_patch_size: 4
  sit_hidden_size: 768
  sit_depth: 12
  sit_num_heads: 12
  sit_mlp_ratio: 4.0
  sit_time_embedding_dim: 256
  attention_backend: auto
grad_clip_norm: 1.0
stages:
  stage1:
    epochs: 0
    require_face_detection_gate: false
  stage2:
    epochs: 4
    gradient_monitor:
      enabled: false
      interval: 20
      max_samples: 8
    stage2_objective:
      type: peft_lora
      flow_condition: embedding
      beta_teacher: 0.0
      gamma_cond: 0.01
      lambda_g: 0.01
      lambda_repr: 0.5
      step_ratio: 4
      lora_rank: 8
      num_generic_embeddings: 16
      ffhq_index: data/ffhq/ffhq_5k_subset/index.jsonl
      ffhq_image_size: 256
      ffhq_per_device_batch: 4
      enable_lora: true
      enable_gated_low_rank: true
      enable_generic_bank: true
      lora_blocks: all
      generic_mode: bank
      freeze_null_embed: false
      lora_target_modules:
      - attn.qkv
      - attn.proj
    quality_eval:
      enabled: false
validation:
  enabled: true
  index: data/index/val_single_face.jsonl
  features: artifacts/e0_features/val_single_face_e0_medium_v1
  max_samples: 64
  batch_size: 16
  face_detection:
    enabled: true
    model_name: buffalo_l
